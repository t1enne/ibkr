[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
only-include = ["src/", "main.py"]

[project]
name = "ibkr"
version = "0.1.0"
description = "Composable CLI toolkit for quantitative trading — data, indicators, models, backtesting"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.3.2",
    "statsmodels>=0.14.0",
    "click>=8.3.1",
    "httpx>=0.25",
    "peewee>=3.17",
    "hmmlearn>=0.3.0",
    "filterpy>=1.4.5",
    "ib-rest-api-client",
    "playwright>=1.60.0",
    "numpy>=2.3.3",
    "exchange-calendars>=4.13.2",
    "scipy>=1.17.1",
    "plotly>=6.9.0",
    "streamlit>=1.63.0",
]

[project.scripts]
ibkr = "main:main"

[tool.uv.sources]
ib-rest-api-client = { path = "../ib-rest-api-client", package = true }

# the project ACTUALLY uses `ty` for type checking.
[tool.pyright] 
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["--import-mode=importlib", "-m not slow"]
markers = [
	"slow: long-running or process-pool-spawning tests, skipped by default (run with `pytest -m slow`)",
	"db: tests that open a sqlite database (peewee or raw) — excluded from `make test-fast`",
]

[dependency-groups]
dev = [
	"pytest>=9.0.2",
	"pytest-mock>=3.15.1",
	"pytest-asyncio>=0.25.0",
	"pytest-watch>=4.2.0",
	"respx>=0.22",
]
